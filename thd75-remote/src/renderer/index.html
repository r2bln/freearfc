<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TH-D75 Remote</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="brand">TH&#8209;D75 <span>Remote</span></div>
  <div class="conn">
    <select id="portSelect" size="1"></select>
    <button id="refreshPorts" title="Rescan ports">&#x21bb;</button>
    <button id="connectBtn" class="primary">Connect</button>
    <span id="connStatus" class="status">disconnected</span>
  </div>
</header>

<section id="radioInfo" class="hidden">
  <span id="infoModel"></span>
  <span id="infoFw"></span>
  <span id="infoRegion"></span>
  <span id="infoPower"></span>
  <span id="infoBatt"></span>
  <span id="infoSingle" class="hidden">Single band</span>
  <span id="infoIo"></span>
</section>

<main>
  <!-- Per-band cards (half width each) -->
  <div class="bands">
    <div class="band card" id="bandA" title="Click empty space to swap bands A/B">
      <div class="band-title">Band A <span class="vm btn" id="vmA" title="Click to toggle VFO / Memory"></span></div>
      <div class="freq" id="freqA">---.----- MHz</div>
      <div class="row">
        <input class="freq-entry" id="freqEntryA" type="text" inputmode="decimal"
               placeholder="145.500000" size="11" title="Type a MHz value and press Enter">
        <button id="applyFreqA">Set</button>
        <span class="tiny">scroll the card to tune</span>
      </div>
      <div class="row tunebar">
        <button class="knob" id="dnA" title="Tune down (hold to repeat)">&#9660;</button>
        <select class="mult" id="multA" title="Steps per click"></select>
        <button class="knob up" id="upA" title="Tune up (hold to repeat)">&#9650;</button>
      </div>
      <div class="row">
        <label>Mode</label>
        <select id="modeA"></select>
        <label>Step</label>
        <select id="stepA"></select>
      </div>
      <div class="row">
        <label>ATT</label>
        <input type="checkbox" id="attA">
        <label>Busy</label>
        <span class="led" id="busyA"></span>
        <label>S&middot;meter</label>
        <span class="smeter"><i id="smA"></i></span>
      </div>
    </div>
    <div class="band card" id="bandB" title="Click empty space to swap bands A/B">
      <div class="band-title">Band B <span class="vm btn" id="vmB" title="Click to toggle VFO / Memory"></span></div>
      <div class="freq" id="freqB">---.----- MHz</div>
      <div class="row">
        <input class="freq-entry" id="freqEntryB" type="text" inputmode="decimal"
               placeholder="433.500000" size="11" title="Type a MHz value and press Enter">
        <button id="applyFreqB">Set</button>
        <span class="tiny">scroll the card to tune</span>
      </div>
      <div class="row tunebar">
        <button class="knob" id="dnB" title="Tune down (hold to repeat)">&#9660;</button>
        <select class="mult" id="multB" title="Steps per click"></select>
        <button class="knob up" id="upB" title="Tune up (hold to repeat)">&#9650;</button>
      </div>
      <div class="row">
        <label>Mode</label>
        <select id="modeB"></select>
        <label>Step</label>
        <select id="stepB"></select>
      </div>
      <div class="row">
        <label>ATT</label>
        <input type="checkbox" id="attB">
        <label>Busy</label>
        <span class="led" id="busyB"></span>
        <label>S&middot;meter</label>
        <span class="smeter"><i id="smB"></i></span>
      </div>
    </div>
  </div>

  <!-- Band-wide controls -->
  <div class="radio card">
    <div class="card-title">Radio</div>
    <div class="row">
      <label>Monitor&rarr;speakers</label>
      <button id="audioToggle" title="Loopback the radio's USB-audio output to the default output">Off</button>
      <span class="tiny" id="audioInfo"></span>
    </div>
    <div class="row">
      <label>Volume</label>
      <input type="range" id="volSlider" min="0" max="200" step="1" value="0" class="vol" title="Scroll or drag">
      <input type="number" id="volNum" min="0" max="200" step="1" value="0" class="volnum" title="AF gain 0..200">
    </div>
    <div class="row">
      <label>GPS</label><input type="checkbox" id="gpsOn">
      <label>GPS&rarr;PC</label><input type="checkbox" id="gpsPc">
      <label>TNC</label><input type="checkbox" id="tncOn">
      <label title="Voice-activated transmit from the radio's own mic">VOX</label><input type="checkbox" id="voxOn">
    </div>
  </div>

  <div class="pttrow card">
    <button id="pttBtn" class="ptt-big"
            title="Hold to transmit on the radio's TX band (bare TX; JP unit: 2 m / 70 cm only)">
      HOLD&nbsp;TO&nbsp;TRANSMIT
    </button>
    <span class="led big" id="txLed" title="Transmitting"></span>
    <span id="txBandInfo" class="tiny"></span>
  </div>

  <div class="channels card">
    <div class="card-title">Local memory
      <span class="tiny">stored on this computer; click a row to recall it into its band (switches the band to VFO)</span>
    </div>
    <div class="chan-columns">
      <div class="chan-col" id="chanColA">
        <div class="chan-col-head">Band A <button id="addChA" title="Store Band A frequency and mode">+</button></div>
        <div class="chan-list" id="chanListA"></div>
      </div>
      <div class="chan-col" id="chanColB">
        <div class="chan-col-head">Band B <button id="addChB" title="Store Band B frequency and mode">+</button></div>
        <div class="chan-list" id="chanListB"></div>
      </div>
    </div>
  </div>

  <div class="log card" id="logCard">
    <div class="card-title">Logs
      <span class="tabs">
        <button class="tabbtn" data-tab="app">App</button>
        <button class="tabbtn" data-tab="cat" id="defaultTab">CAT</button>
      </span>
      <button id="logCollapse" title="Show / hide the log panel">&#8722;</button>
    </div>
    <div id="logBody">
      <pre id="log" class="hidden"></pre>
      <pre id="appLog"></pre>
    </div>
  </div>
</main>

<div id="toast" class="hidden"></div>
<script src="constants.js"></script>
<script src="app.js"></script>
</body>
</html>
